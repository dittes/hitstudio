<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0c0c10; font-family: "Inter", sans-serif; color: #f5f3ff; }
    #ec-lockup { position: absolute; left: 0; right: 0; top: 380px; height: 170px; display: flex; align-items: center; justify-content: center; gap: 40px; }
    #ec-logo { width: 170px; height: 170px; }
    #ec-logo svg { width: 100%; height: 100%; display: block; overflow: visible; }
    #ec-name { font-weight: 800; font-size: 132px; letter-spacing: -0.04em; line-height: 1; padding-bottom: 8px; }
    #ec-url { position: absolute; left: 0; right: 0; top: 628px; text-align: center; font-weight: 700; font-size: 64px; letter-spacing: -0.02em; }
    #ec-url b { background: linear-gradient(90deg, #f472b6, #fb923c); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
    #ec-tag { position: absolute; left: 0; right: 0; top: 728px; text-align: center; font-weight: 600; font-size: 40px; letter-spacing: -0.01em; color: #a1a1b5; }
  </style>
  <div id="root" data-composition-id="endcard" data-width="1920" data-height="1080">
    <div id="ec-lockup">
      <div id="ec-logo">
        <!-- HitStudio's own favicon.svg -->
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="ec-g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa" /><stop offset=".55" stop-color="#f472b6" /><stop offset="1" stop-color="#fb923c" /></linearGradient></defs>
          <rect width="64" height="64" rx="18" fill="url(#ec-g)" />
          <g fill="#fff">
            <rect id="ec-bar1" x="15" y="25" width="8" height="18" rx="4" />
            <rect id="ec-bar2" x="28" y="14" width="8" height="36" rx="4" />
            <rect id="ec-bar3" x="41" y="21" width="8" height="26" rx="4" />
          </g>
        </svg>
      </div>
      <div id="ec-name">HitStudio</div>
    </div>
    <div id="ec-url"><b>hitstudio.org</b></div>
    <div id="ec-tag">Make music. Feel it.</div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var beat = 60 / 104;
      // the tile lands on the impact, taking over from the shrinking Orb
      tl.fromTo("#ec-logo", { scale: 0.55, x: 330, opacity: 1 }, { scale: 1, x: 330, duration: 0.5, ease: "expo.out" }, 0);
      // the three bars rise like meters (the logo's own eq motion in the app)
      ["#ec-bar1", "#ec-bar2", "#ec-bar3"].forEach(function (b, i) {
        tl.fromTo(b, { scaleY: 0.15, transformOrigin: "50% 50%" }, { scaleY: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.08 + i * 0.06);
      });
      // then the tile slides left as the wordmark wipes in beside it
      tl.to("#ec-logo", { x: 0, duration: 0.55, ease: "power3.inOut" }, 0.62);
      tl.fromTo("#ec-name", { clipPath: "inset(0 100% 0 0)", x: -30 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.55, ease: "power3.inOut" }, 0.66);
      tl.fromTo("#ec-url", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.25);
      tl.fromTo("#ec-tag", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.55);
      // the bars keep the beat for one bar, like the app's logo, then rest
      for (var k = 0; k < 4; k++) {
        var at = 1.154 + k * beat;
        ["#ec-bar1", "#ec-bar2", "#ec-bar3"].forEach(function (b, i) {
          var lo = [0.62, 0.78, 0.68][(i + k) % 3];
          tl.to(b, { scaleY: lo, duration: beat * 0.45, ease: "sine.inOut" }, at);
          tl.to(b, { scaleY: 1, duration: beat * 0.5, ease: "sine.inOut" }, at + beat * 0.45);
        });
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["endcard"] = tl;
    })();
  </script>
</template>
