    const host = window.__hsOrb;
    const F = window.ORB_FEATURES;
    const W = 1920, H = 1080, HZ = 60, DT = 1 / HZ;
    const PAL = ["#a78bfa", "#f472b6", "#fb923c", "#38bdf8"]; // HitStudio palette (scenes/types.js)

    // Same renderer setup as app/features/visualizer/renderer3d.js
    const gpu = new THREE.WebGLRenderer({ canvas: document.getElementById("orb-canvas"), antialias: false, alpha: false, preserveDrawingBuffer: true });
    gpu.setPixelRatio(1);
    gpu.setSize(W, H, false);
    gpu.toneMapping = THREE.ACESFilmicToneMapping;
    gpu.toneMappingExposure = 0.85;
    gpu.setClearColor(0x06050b, 1);

    function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    let S = null;
    function build() {
      if (S) { S.orb.dispose(); S.ambient.dispose(); S.fx.composer.dispose(); }
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06050b);
      const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 400);
      const pal = { a: new THREE.Color(PAL[0]), b: new THREE.Color(PAL[1]), c: new THREE.Color(PAL[2]), d: new THREE.Color(PAL[3]) };
      const ctx = { renderer: gpu, scene, camera, pal, rig: { pos: new THREE.Vector3(0, 4, 14), look: new THREE.Vector3(), fov: 60 }, px: Math.max(0.6, H / 900), time: 0 };
      camera.position.copy(ctx.rig.pos);
      const ambient = createAmbientParticles(scene);
      const orb = createOrb();
      const real = Math.random;
      Math.random = mulberry32(20261114); // seeded, so every render is identical
      try { orb.init(ctx); } finally { Math.random = real; }
      const composer = new EffectComposer(gpu);
      const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.7, 0.55, 0.1);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(bloom);
      composer.addPass(new OutputPass());
      composer.setSize(W, H);
      S = { scene, camera, ctx, ambient, orb, fx: { composer, bloom }, look: new THREE.Vector3(), first: true, frame: -1, a: null };
    }

    const bands64 = new Float32Array(64);
    function features(i) {
      const k = Math.max(0, Math.min(F.n - 1, i));
      const b = F.bands[k];
      for (let j = 0; j < 64; j++) bands64[j] = b[j >> 2];
      return { bands: bands64, bass: F.bass[k], mid: F.mid[k], treble: F.treble[k], kick: F.kick[k], energy: F.energy[k] };
    }

    // One tick of the app's render loop (renderer3d.js), at a fixed 60 Hz step.
    function step(i) {
      const a = features(i);
      const c = S.ctx;
      c.time += DT;
      S.ambient.update(DT, a, c, true);
      S.orb.update(DT, a, c);
      const ck = S.first ? 1 : 1 - Math.exp(-DT * 2.4);
      S.camera.position.lerp(c.rig.pos, ck);
      S.look.lerp(c.rig.look, ck);
      S.camera.lookAt(S.look);
      if (Math.abs(S.camera.fov - c.rig.fov) > 0.01) { S.camera.fov += (c.rig.fov - S.camera.fov) * ck; S.camera.updateProjectionMatrix(); }
      S.first = false;
      S.fx.bloom.strength = 0.28 + a.energy * 0.25 + a.kick * 0.3;
      S.fx.bloom.radius = 0.55 + a.bass * 0.25;
      S.fx.bloom.threshold = 0.55;
      S.frame = i;
    }

    function render(t) {
      const target = Math.max(0, Math.round(t * HZ));
      if (!S || target < S.frame) build();
      while (S.frame < target) step(S.frame + 1);
      // lens: shift (screen px at the 1.125 full-bleed scale) and zoom, applied to the projection only
      const L = host.lens || { dx: 0, dy: 0, zoom: 1 };
      S.camera.zoom = L.zoom;
      S.camera.setViewOffset(W, H, -L.dx / 1.125, -L.dy / 1.125, W, H);
      S.fx.composer.render(DT);
    }

    build();
    render(0);
    host.render = render;
    host.ready();
